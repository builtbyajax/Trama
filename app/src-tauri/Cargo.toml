[package]
name = "trama"
version = "0.3.0"
description = "Trama: quadro de tarefas local com agentes"
edition = "2021"
rust-version = "1.90"
default-run = "trama"

[lib]
name = "trama_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
dirs = "7"
uuid = { version = "1", features = ["v4"] }
unicode-normalization = "0.1"
url = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
chrono = { version = "0.4", default-features = false, features = ["std"] }
trash = "5"
tauri-plugin-updater = "2.14.0"

[features]
agent-cli = []
dev-bridge = []
diagnostic = ["tauri/devtools"]

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "trama-agent"
path = "src/bin/trama-agent.rs"
required-features = ["agent-cli"]

[[bin]]
name = "trama-api"
path = "src/bin/trama-api.rs"
required-features = ["dev-bridge"]
