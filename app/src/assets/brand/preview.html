<!doctype html>
<html lang="pt-BR">
  <meta charset="utf-8" /><title>Trama aberta · SVG final</title
  ><style>
    body {
      margin: 0;
      background: #111317;
      color: #edf1f8;
      font:
        14px -apple-system,
        sans-serif;
    }
    main {
      padding: 36px;
      display: flex;
      align-items: center;
      gap: 42px;
    }
    h1 {
      font-size: 24px;
      font-weight: 550;
      margin: 0 0 10px;
    }
    p {
      color: #a4adbd;
      margin: 0 0 28px;
    }
    .sizes {
      display: flex;
      gap: 24px;
      align-items: end;
    }
    .sizes div {
      display: grid;
      justify-items: center;
      gap: 12px;
      color: #a4adbd;
      font-size: 11px;
    }
    .hero {
      width: 288px;
      height: 288px;
    }
  </style>
  <main>
    <img
      class="hero"
      src="trama-aberta-master.svg"
      alt="Trama aberta sem emendas internas"
    />
    <div>
      <h1>Trama aberta</h1>
      <p>Contornos contínuos, sem riscos nas pills.</p>
      <div class="sizes">
        <div>
          <img
            src="trama-aberta-16.svg"
            width="16"
            height="16"
            alt="Ícone em 16 px"
          /><span>16 px</span>
        </div>
        <div>
          <img
            src="trama-aberta-24.svg"
            width="24"
            height="24"
            alt="Ícone em 24 px"
          /><span>24 px</span>
        </div>
        <div>
          <img
            src="trama-aberta-32.svg"
            width="32"
            height="32"
            alt="Ícone em 32 px"
          /><span>32 px</span>
        </div>
        <div>
          <img
            src="trama-aberta-64.svg"
            width="64"
            height="64"
            alt="Ícone em 64 px"
          /><span>64 px</span>
        </div>
      </div>
    </div>
  </main>
</html>
