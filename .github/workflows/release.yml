name: Build installers

on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            runner: macos-latest
            target: aarch64-apple-darwin
            bundle: dmg
            assetNamePattern: '[name]_[version]_macOS_Apple-Silicon[ext]'
          - name: macOS Intel
            runner: macos-latest
            target: x86_64-apple-darwin
            bundle: dmg
            assetNamePattern: '[name]_[version]_macOS_Intel[ext]'
          - name: Windows x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: nsis
            assetNamePattern: '[name]_[version]_Windows_x64_Setup[ext]'

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Check version and release tag
        id: version
        shell: bash
        run: node app/scripts/check-version.mjs --release

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build files
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
          key: ${{ matrix.target }}

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Build app and MCP server, then upload installers
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          # This wrapper builds and bundles trama-agent before the desktop app.
          tauriScript: npm run tauri
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundle }}
          tagName: v__VERSION__
          releaseName: Trama __VERSION__
          releaseAssetNamePattern: ${{ matrix.assetNamePattern }}
          releaseCommitish: ${{ github.sha }}
          releaseDraft: true
          prerelease: true
          releaseBody: |
            Trama ${{ steps.version.outputs.version }} is an early test release. Each installer includes the local MCP server.

            - **macOS Apple Silicon:** DMG for Apple Silicon Macs.
            - **macOS Intel:** DMG for Intel Macs.
            - **Windows x64:** installer for 64-bit Windows.

            These test builds are not notarized on macOS or code-signed on Windows. macOS may require approval in Privacy & Security; Windows may show a SmartScreen warning.

            See the [macOS installation guide](https://github.com/builtbyajax/Trama/blob/main/docs/installation.md#macos) or [Windows installation guide](https://github.com/builtbyajax/Trama/blob/main/docs/installation.md#windows) before opening the app.
          uploadUpdaterJson: false
          uploadWorkflowArtifacts: true
