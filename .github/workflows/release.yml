name: Build installers

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  build:
    needs: checks
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            runner: macos-latest
            target: aarch64-apple-darwin
            bundle: dmg
            asset: macOS_Apple-Silicon
          - name: macOS Intel
            runner: macos-15-intel
            target: x86_64-apple-darwin
            bundle: dmg
            asset: macOS_Intel
          - name: Windows x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: nsis
            asset: Windows_x64_Setup
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Check version, release tag and installation guide
        id: version
        shell: bash
        run: |
          test -f docs/installation.md
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            node app/scripts/check-version.mjs --release
          else
            node app/scripts/check-version.mjs
          fi
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: app/src-tauri -> target
          key: ${{ matrix.target }}
      - working-directory: app
        run: npm ci
      - name: Build installers without uploading
        id: bundle
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        with:
          projectPath: app
          tauriScript: npm run tauri
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundle }}
          uploadUpdaterJson: false
      - name: Test the MCP server from the packaged app
        working-directory: app
        env:
          ARTIFACT_PATHS: ${{ steps.bundle.outputs.artifactPaths }}
        run: node scripts/verify-packaged-agent.mjs ${{ matrix.target }}
      - name: Stage the verified installer
        working-directory: app
        env:
          ARTIFACT_PATHS: ${{ steps.bundle.outputs.artifactPaths }}
          APP_VERSION: ${{ steps.version.outputs.version }}
          ASSET_PLATFORM: ${{ matrix.asset }}
        shell: bash
        run: node scripts/release-assets.mjs stage "$APP_VERSION" "$ASSET_PLATFORM" ../release-assets
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-${{ matrix.asset }}
          path: release-assets
          if-no-files-found: error

  checksums:
    # Verify the combined assets on branches too, without creating a release or tag.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: installer-*
          path: release-assets
          merge-multiple: true
      - name: Generate checksums and release notes
        run: |
          node app/scripts/release-assets.mjs checksums release-assets
          node app/scripts/release-notes.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-installers
          path: release-assets
          if-no-files-found: error

  draft:
    # All installers, their MCP contracts and checksums must pass before release upload.
    needs: checksums
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-installers
          path: release-assets
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          VERSION=$(node -p "JSON.parse(require('fs').readFileSync('app/package.json')).version")
          gh release create "v$VERSION" release-assets/*.dmg release-assets/*.exe release-assets/SHA256SUMS --title "Trama $VERSION" --notes-file release-assets/RELEASE_NOTES.md --target "$GITHUB_SHA" --draft --prerelease
