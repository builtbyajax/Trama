name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Check builds do not package a sidecar; installer builds prepare the real binary.
  TAURI_CONFIG: '{"bundle":{"externalBin":[]}}'

jobs:
  quality:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
      - name: Install frontend dependencies
        working-directory: app
        run: npm ci
      - name: Check package versions
        run: node app/scripts/check-version.mjs
      - name: Check frontend and scripts
        working-directory: app
        run: |
          npm run typecheck
          npm run format:check
          npm test
          npm run build
      - name: Check Rust formatting and lint
        working-directory: app/src-tauri
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets --features agent-cli,dev-bridge -- -D warnings

  backend:
    name: Rust and MCP (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    defaults:
      run:
        working-directory: app/src-tauri
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - working-directory: app
        run: |
          npm ci
          npm run build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
      - name: Test data operations and real MCP process
        run: cargo test --locked --features agent-cli,dev-bridge
      - name: Build release binaries
        run: cargo build --locked --release --features agent-cli,dev-bridge --bins

  msrv:
    name: Rust 1.90 compatibility
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.90.0"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
      - working-directory: app/src-tauri
        run: cargo check --locked --all-targets --features agent-cli,dev-bridge

  browser:
    name: Browser workflows (macOS)
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: browser-failures
          path: app/test-results
          retention-days: 7
